[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-liked-analyzer"
version = "0.1.0"
description = "Local-first video evidence extraction and summarization pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
transcribe = [
  "faster-whisper",
]
ai = [
  "openai>=1.0",
]
gemini = [
  "google-genai>=1",
]
ocr = [
  "paddleocr>=3.0",
  "Pillow>=10",
]
scene = [
  "scenedetect==0.6.5.2",
  "platformdirs>=4",
  "opencv-contrib-python==4.10.0.84",
]
vision = [
  "openai>=1.0",
  "Pillow>=10",
]
all = [
  "pytest>=8",
  "faster-whisper",
  "openai>=1.0",
  "google-genai>=1",
  "paddleocr>=3.0",
  "scenedetect==0.6.5.2",
  "platformdirs>=4",
  "opencv-contrib-python==4.10.0.84",
  "Pillow>=10",
]

[project.scripts]
video-summary = "video_summarizer.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
